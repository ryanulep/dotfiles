# === Appearance ===
set colorscheme catppuccin
set unicode_ellipsis true
set draw_borders separators

# === Preview ===
# Image/PDF image previews are disabled: the iTerm inline-image protocol does
# not pass through tmux with tmux-256color, so it was unreliable. Text previews
# (code, etc.) via scope.sh still work everywhere.
set preview_images false
set use_preview_script true
set preview_script ~/.config/ranger/scope.sh
set automatically_count_files true
set open_all_images true

# === VCS ===
set vcs_aware true
set vcs_backend_git enabled

# === Behavior ===
set show_hidden false
set confirm_on_delete multiple
set mouse_enabled false
set column_ratios 1,3,4
set hidden_filter ^\.|\.(?:pyc|pyo|bak|swp)$|^lost\+found$|^__(py)?cache__$
set sort natural
set sort_directories_first true

# === Key bindings ===
map <C-f>  fzf_select
map .      set show_hidden!
map zh     set show_hidden!
map <C-r>  reload_cwd
map e      edit
map <C-l>  redraw_window
