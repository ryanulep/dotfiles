%hidden MODULE_NAME='memory'

set -gq "@catppuccin_${MODULE_NAME}_icon" ' '
# Preserve the 30%/80% warning colors with native formats. All occurrences use
# the same cached percentage job instead of calling ram_bg_color separately.
# Defer the whole conditional through Catppuccin's E/F expansion stages.
set -gq "@catppuccin_${MODULE_NAME}_color" '#{l:#{?#{m/r:^ *([89][0-9]|100),#{ram_percentage}},#{@thm_red},#{?#{m/r:^ *([3-9][0-9]|100),#{ram_percentage}},#{@thm_yellow},#{@thm_green}}}}'
set -gq "@catppuccin_${MODULE_NAME}_text" ' #{l:#{ram_percentage}}'

source -F '#{TMUX_PLUGIN_MANAGER_PATH}/tmux/utils/status_module.conf'
