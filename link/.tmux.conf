######################################
# General Tmux Configuration
######################################

# Theme modules use these paths before TPM runs.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"
set-environment -g CUSTOM_MODULES_PATH "$HOME/.tmux/custom_modules"

# Improve colors
set -g default-terminal "tmux-256color"

# allow focus events to get through to applications running in tmux
set -g focus-events on

# Forward OSC sequences to the outer terminal so tools like delta can query
# the background color (detect-dark-light) even inside a tmux session
set -g allow-passthrough on

# Propagate COLORFGBG from the attaching client so Prefix+T theme reload
# picks up the correct light/dark value after switching terminal themes
# Append once even after automatic reloads; retain tmux's platform defaults.
if -F '#{m:*COLORFGBG*,#{update-environment}}' '' 'set -ga update-environment COLORFGBG'

# Super useful when using "grouped sessions" and multi-monitor setup
setw -g aggressive-resize on

# Start window numbers at 1 to match keyboard order with tmux window order
set -g base-index 1
set -g pane-base-index 1
# Renumber windows sequentially after closing any of them
set -g renumber-windows on
set -g allow-rename on
set -wg automatic-rename on

# Increase scrollback buffer size from 2,000 to 50,000 lines
set -g history-limit 50000

# Increase tmux messages display duration from 750ms to 3s
set -g display-time 3000

# CPU/RAM/IP remain visible; 15 seconds avoids constant background polling.
set -g status-interval 15

# Start with mouse mode enabled
set -g mouse on

# vi copy-mode bindings
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# split panes using | and -
unbind '"'
unbind %

# Reload config and re-apply light/dark theme based on current COLORFGBG.
# Unset @thm_* and @catppuccin_* first — catppuccin uses set -ogq (no-overwrite),
# so variables must be cleared before re-sourcing or the old flavor's colors stick.
bind T run-shell 'for v in $(tmux show -g | awk "/^@thm_|^@catppuccin_/{print \$1}"); do tmux set -gu "$v"; done; tmux source-file ~/.tmux.conf' \; display-message "Theme reloaded"

######################################
# Tmux Plugin Manager (TPM) Configuration
######################################

## Initialization
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'sainnhe/tmux-fzf'  # Prefix+F — fzf-driven tmux actions (sessions, windows, commands)

## Theme / Appearance
set -g @plugin 'catppuccin/tmux#v2.1.3' # See https://github.com/catppuccin/tmux/tags for additional tags
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'  # Shows app icon in window tab
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'dreknix/tmux-primary-ip'

# A new checkout remains usable before dependencies are installed. Installation
# is explicit (dotfiles-tmux-plugins), including repair of partial installs.
if-shell '[ -x "#{TMUX_PLUGIN_MANAGER_PATH}tmux/catppuccin.tmux" ]' {
# Pick flavor based on terminal background: latte for light, mocha for dark.
# COLORFGBG last segment >=8 means light. Re-source tmux.conf after switching
# terminal themes to update (Prefix+T).
if-shell '_b=${COLORFGBG##*;}; [ "${_b:-0}" -ge 8 ]' \
  "set -g @catppuccin_flavor 'latte'" \
  "set -g @catppuccin_flavor 'mocha'"
set -g @catppuccin_window_status_style 'rounded'
# Native color conditions reuse the percentage job instead of spawning separate
# cpu_fg_color/cpu_bg_color processes. Keep the high-usage warning at 80%.
set -g @catppuccin_status_cpu_text_fg '#{?#{m/r:^ *([89][0-9]|100),#{cpu_percentage}},#{@thm_crust},#{@thm_fg}}'
set -g @catppuccin_status_cpu_text_bg '#{?#{m/r:^ *([89][0-9]|100),#{cpu_percentage}},#{@thm_red},#{@thm_surface1}}'
run '#{TMUX_PLUGIN_MANAGER_PATH}tmux/catppuccin.tmux'
# Pane borders use catppuccin theme variables (set by catppuccin.tmux above)
set -g pane-border-style "fg=#{@thm_surface2}"
set -g pane-active-border-style "fg=#{@thm_blue},bold"

## Status bar modules
source -F '#{CUSTOM_MODULES_PATH}/memory.conf'
source -F '#{CUSTOM_MODULES_PATH}/primary_ip.conf'

set -g status-right-length 100
set -g status-left-length 100

set -g status-left "#[fg=#{@thm_fg},bg=#{@thm_bg} bold] #S "
# Named sessions identify projects/worktrees even when the active app is a shell.
set -ag status-left "#{?client_prefix,#[fg=#{@thm_red} bold]PREFIX ,#{?#{==:#{pane_mode},copy-mode},#[fg=#{@thm_yellow} bold]COPY ,#[fg=#{@thm_green} bold]NORMAL }}"

set -g status-right ""
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_memory}"
set -agF status-right "#{E:@catppuccin_status_primary_ip}"
}

## Windows / Panes / Sessions
set -g @plugin 'christoomey/vim-tmux-navigator' # Ctrl+h/j/k/l across editor and shell panes
# Prefix+Ctrl+l still clears the shell; Ctrl+l navigates right without a prefix.
set -g @plugin 'tmux-plugins/tmux-sessionist'   # Prefix+G go to session, Prefix+C create, Prefix+X kill
set -g @plugin 'tmux-plugins/tmux-pain-control' # Prefix+| and - split; hjkl resize with Prefix+shift
set -g @plugin 'tmux-plugins/tmux-sidebar'      # Prefix+Tab — file tree sidebar

## System
set -g @plugin 'tmux-plugins/tmux-cowboy'        # Prefix+! — send SIGKILL to stuck process in pane
set -g @plugin 'noscript/tmux-mighty-scroll'     # Seamless mouse scroll through pane history
set -g @plugin 'b0o/tmux-autoreload'             # Auto-reload tmux.conf on save
set -g @plugin 'laktak/extrakto'                 # Prefix+e — fzf-pick any text/URL/path from pane output
set -g @extrakto_key 'e'                         # Rebind from Tab (conflicts with tmux-sidebar)
set -g @plugin 'tmux-plugins/tmux-logging'       # Prefix+shift+P — toggle pane logging to file

## Productivity
set -g @plugin 'tmux-plugins/tmux-copycat'       # Prefix+/ — regex search in scroll buffer
set -g @plugin 'tmux-plugins/tmux-yank'          # y in copy-mode yanks to system clipboard
set -g @plugin 'tmux-plugins/tmux-open'          # In copy-mode: o opens selection, Ctrl+o in editor
set -g @plugin 'tmux-plugins/tmux-fpp'           # f — pick file paths from pane output with PathPicker
set -g @plugin 'alexwforsythe/tmux-which-key'    # Prefix+Space — cheatsheet of all prefix bindings
set -g @plugin 'nhdaly/tmux-better-mouse-mode'   # Improved mouse scroll behaviour

## Must be last — session persistence
set -g @plugin 'tmux-plugins/tmux-resurrect'     # Prefix+Ctrl+S save, Prefix+Ctrl+R restore sessions
set -g @plugin 'tmux-plugins/tmux-continuum'     # Auto-save every 15min; restore on tmux start
set -g @continuum-restore 'on'
# Preserve session restoration, but fit older saved layouts to the current
# terminal. An undersized layout otherwise produces a wide dotted margin.
set -g @resurrect-hook-post-restore-all '~/.tmux/resize-restored-windows.sh'
set-hook -g client-attached[90] 'run-shell ~/.tmux/resize-restored-windows.sh'

# Local config
if-shell "[ -f ~/.tmux.conf.local ]" 'source ~/.tmux.conf.local'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
if-shell '[ -x ~/.tmux/plugins/tpm/tpm ]' 'run ~/.tmux/plugins/tpm/tpm'
